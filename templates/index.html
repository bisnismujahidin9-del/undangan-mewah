<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Premium Royal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Georgia', serif; 
            /* Menggunakan gambar background batik emas gelap premium */
            background: url("https://unsplash.com") no-repeat center center fixed; 
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #0b0b0b; /* Warna cadangan jika internet lambat */
        }
        
        /* Kartu Undangan Utama - Royal Black Gold */
        .card {
            background: linear-gradient(145deg, #141414, #1f1f1f);
            border: 3px double #d4af37; /* Bingkai Emas Ganda */
            padding: 50px 30px;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.2);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Aksen Ornamen Merak & Batik (Menggunakan Simbol & Hiasan CSS) */
        .card::before {
            content: "🦚"; /* Simbol Merak Royal */
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 4px rgba(214, 175, 55, 0.5));
        }

        .card::after {
            content: "❖ ❖ ❖"; /* Simbol Ornamen Batik Klasik */
            letter-spacing: 10px;
            font-size: 0.8rem;
            color: #d4af37;
            display: block;
            margin-top: 25px;
            opacity: 0.7;
        }

        p.sub { 
            font-size: 0.85rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            color: #d4af37; 
            font-weight: bold;
        }

        h1 { 
            font-size: 2.8rem; 
            color: #f3e5ab; /* Emas Muda Elegan */
            margin: 25px 0; 
            font-weight: normal;
            font-family: 'Times New Roman', Times, serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
        }

        .foto-container {
            position: relative;
            display: inline-block;
            margin: 15px 0;
        }

        /* Bingkai Foto Emas */
        .foto { 
            width: 260px; 
            height: 360px; 
            object-fit: cover; 
            border-radius: 130px 130px 20px 20px; /* Bentuk Kubah Royal */
            border: 3px solid #d4af37; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
        }

        .tgl { 
            font-size: 1.2rem; 
            color: #d4af37; 
            margin-top: 20px; 
            letter-spacing: 1px;
        }

        p.quote {
            margin-top: 15px; 
            font-size: 0.9rem; 
            color: #b3b3b3; 
            font-style: italic;
            line-height: 1.5;
        }
        
        /* Panel Edit/Ganti Data di bagian bawah */
        .form-edit {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 15px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: left;
        }
        .form-edit h3 { margin-bottom: 20px; color: #d4af37; font-family: sans-serif; text-align: center; }
        .form-edit label { font-size: 0.85rem; font-family: sans-serif; font-weight: bold; color: #ccc; }
        .form-edit input { width: 100%; padding: 12px; margin: 6px 0 18px 0; background: #262626; border: 1px solid #444; border-radius: 8px; color: #fff; font-family: sans-serif; }
        .form-edit input:focus { border-color: #d4af37; outline: none; }
        .btn-simpan { width: 100%; padding: 14px; background: linear-gradient(135deg, #d4af37, #aa841b); color: #111; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .btn-simpan:hover { background: linear-gradient(135deg, #f3e5ab, #d4af37); }
    </style>
</head>
<body>

    <!-- KARTU UNDANGAN UTAMA (ROYAL THEME) -->
    <div class="card">
        <p class="sub">Walimatul 'Ursy</p>
        <h1>{{ info.wanita }} & {{ info.pria }}</h1>
        
        <div class="foto-container">
            <img src="{{ info.link_foto }}" class="foto" alt="Foto Pengantin">
        </div>
        
        <p class="tgl">✨ {{ info.tanggal }} ✨</p>
        <p class="quote">"Maha Suci Allah yang telah menciptakan makhluk-Nya berpasang-pasangan. Segala puji bagi-Nya atas karunia pernikahan yang agung ini."</p>
    </div>

    <!-- PANEL FORM EDIT (LIVE CONFIGURATION) -->
    <div class="form-edit">
        <h3>🛠️ Kontrol Panel Undangan Premium</h3>
        <form action="/update" method="POST">
            <label>Nama Pengantin Wanita:</label>
            <input type="text" name="wanita" value="{{ info.wanita }}">

            <label>Nama Pengantin Pria:</label>
            <input type="text" name="pria" value="{{ info.pria }}">

            <label>Tanggal Pernikahan:</label>
            <input type="text" name="tanggal" value="{{ info.tanggal }}">

            <label>Link Foto Pengantin (URL):</label>
            <input type="text" name="link_foto" value="{{ info.link_foto }}">

            <!-- Background otomatis diset dari Python, tapi bisa ditempel link lain di sini -->
            <label>Link Gambar Background (URL):</label>
            <input type="text" name="link_bg" value="{{ info.link_bg }}">

            <button type="submit" class="btn-simpan">Terapkan Desain Mewah</button>
        </form>
    </div>

</body>
</html>
